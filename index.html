<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Fit Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: graph-paper ground; a scoreboard strip on top, a 6x3 category board below; questions open as a worksheet card. */
:root{
  --paper:#EDF2F5; --grid:#D3DEE6; --card:#FFFFFF; --ink:#15212C; --muted:#566876; --line:#C3D0DA;
  --accent:#D2452A; --accent-ink:#FFFFFF; --good:#13804A; --good-bg:#DDF3E6; --bad:#B42318; --bad-bg:#FBE3E0;
  --c1:#0F7C86; --c2:#B7791F; --c3:#6D4BC4; --c4:#C2366B; --c5:#2563C9; --c6:#3C8A2E;
  --p1:#2563C9; --p2:#C2410C; --p3:#0F7C5A;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E161D; --grid:#1A2731; --card:#15212B; --ink:#E5EDF2; --muted:#93A5B2; --line:#2A3B48;
  --accent:#F26B4F; --accent-ink:#1A0D09; --good:#4BD08A; --good-bg:#12321F; --bad:#FF8A7A; --bad-bg:#3A1714;
  --c1:#3CC3CC; --c2:#E7A93F; --c3:#A88BF5; --c4:#F0709F; --c5:#6FA3F5; --c6:#79C866;
  --p1:#6FA3F5; --p2:#F59A5B; --p3:#4FD1A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E161D; --grid:#1A2731; --card:#15212B; --ink:#E5EDF2; --muted:#93A5B2; --line:#2A3B48;
  --accent:#F26B4F; --accent-ink:#1A0D09; --good:#4BD08A; --good-bg:#12321F; --bad:#FF8A7A; --bad-bg:#3A1714;
  --c1:#3CC3CC; --c2:#E7A93F; --c3:#A88BF5; --c4:#F0709F; --c5:#6FA3F5; --c6:#79C866;
  --p1:#6FA3F5; --p2:#F59A5B; --p3:#4FD1A0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 18px;font-weight:700}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px}
.eyebrow{font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* masthead */
.mast{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.mast h1{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em}
.mast .sub{color:var(--muted)}
.logo{width:56px;height:44px;flex:none}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
.field input,.field select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 16px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rules ol{padding-left:22px;margin:10px 0 0;display:grid;gap:8px}
.rules li{max-width:62ch}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:14px}
.legend div{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px}

/* scoreboard */
.scorebar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:16px}
.pcard{flex:1 1 150px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.pcard.active{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 25%,transparent)}
.pcard .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .turn{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--pc)}
.pcard .sc{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--pc)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.clock{flex:0 1 210px;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.clock .t{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1}
.clock .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.clock button{background:transparent;border:1.5px solid color-mix(in srgb,var(--paper) 50%,transparent);color:var(--paper);border-radius:8px;padding:2px 10px;font-size:14px}
.clock small{font-size:13px;opacity:.8}
.banner{background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:900px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.colhead{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:118px;display:flex;flex-direction:column;gap:4px}
.colhead b{font-family:var(--display);font-size:17px;line-height:1.15;display:flex;gap:7px;align-items:flex-start}
.colhead span{font-size:13px;color:var(--muted);line-height:1.3}
.colhead .acc{font-size:12px;font-family:var(--mono)}
.tile{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--card));border-radius:10px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.tile:hover:not(:disabled){transform:translateY(-2px);background:color-mix(in srgb,var(--cc) 22%,var(--card))}
.tile .v{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--cc);line-height:1}
.tile .l{font-size:13px;font-weight:700;color:var(--muted)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.tile .who{display:flex;gap:3px;min-height:9px}
.tile .who i{width:9px;height:9px;border-radius:50%}
.tile.played{border-style:dashed;background:var(--card);cursor:not-allowed;transform:none}
.tile.played .v{color:var(--muted);opacity:.6}
.tile .mark{font-size:13px;font-weight:700}
.tile .mark.right{color:var(--good)} .tile .mark.wrong{color:var(--bad)}
.tile:disabled:not(.played){opacity:.5;cursor:not-allowed}
.tip{margin-top:14px;color:var(--muted);font-size:15px}

/* question */
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:color-mix(in srgb,var(--cc) 14%,var(--card));border-bottom:1.5px solid var(--line)}
.qhead .cat{font-weight:700;color:var(--cc);display:flex;gap:8px;align-items:center}
.qhead .who{font-weight:700}
.qbody{padding:22px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.qbody.has-vis{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:820px){.qbody.has-vis{grid-template-columns:1fr}}
.prompt{font-size:20px;line-height:1.45;max-width:62ch}
.prompt .eq{font-family:var(--mono);background:var(--paper);padding:2px 8px;border-radius:6px;white-space:nowrap}
.vis{min-width:0}
.vis svg{width:100%;height:auto;max-width:440px;display:block}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;text-align:left;font-size:17px;display:flex;gap:12px;align-items:flex-start}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice .k{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-thickness:1px}
.choice:disabled{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.numrow input{font:inherit;font-family:var(--mono);font-size:22px;width:180px;max-width:100%;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.feedback{border-radius:12px;padding:14px 16px;border:2px solid var(--line);background:var(--paper)}
.feedback.good{border-color:var(--good);background:var(--good-bg)}
.feedback.bad{border-color:var(--bad);background:var(--bad-bg)}
.feedback h3{font-size:20px;margin-bottom:6px}
.feedback p{margin:6px 0;max-width:68ch}
.work{font-family:var(--mono);font-size:15px;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;white-space:pre-wrap;overflow-x:auto}
.steal{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:0 20px 20px}
.rubric{display:grid;gap:8px;margin-top:8px}
.rubric label{display:flex;gap:10px;align-items:flex-start;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.rubric input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.model{background:var(--card);border-left:4px solid var(--good);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0}
.selgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
@media (max-width:520px){.selgrid{grid-template-columns:1fr}}
.selgrid label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.selgrid select{font:inherit;font-weight:400;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.selgrid select.right{border-color:var(--good)} .selgrid select.wrong{border-color:var(--bad)}
.paper-note{font-size:15px;color:var(--ink);display:flex;gap:8px;align-items:center}

/* team round */
.team-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.team-grid{grid-template-columns:1fr}}
table.data{border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.data th,table.data td{border:1.5px solid var(--line);padding:6px 14px;text-align:center}
table.data th{font-family:var(--body);font-size:14px;background:var(--paper)}
.parts{display:grid;gap:12px;margin:0;padding-left:0;list-style:none}
.parts li{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
.parts b.pl{font-family:var(--mono);color:var(--accent)}
.pscore{display:grid;gap:16px}
.pscore .who{font-weight:700;font-family:var(--display);font-size:20px}

/* results */
.results{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.results{grid-template-columns:1fr}}
.podium{display:grid;gap:10px}
.podium .r{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:12px;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--card))}
.podium .r b{font-family:var(--display);font-size:22px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--cc)}
.missed{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ============ helpers ============ */
const $ = (s, el=document) => el.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const rd = (v,d=2) => Math.round(v*10**d)/10**d;
const fmt = (v,d=2) => Number(rd(v,d)).toLocaleString('en-US',{maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gauss = () => { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const MINUS = '−';
function corr(pts){ const n=pts.length, mx=pts.reduce((s,p)=>s+p[0],0)/n, my=pts.reduce((s,p)=>s+p[1],0)/n;
  let sxy=0,sxx=0,syy=0; for(const [x,y] of pts){sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2;}
  return {r: sxy/Math.sqrt(sxx*syy), b: sxy/sxx, a: my - (sxy/sxx)*mx}; }
function sgn(v,d){ return (v<0?MINUS:'') + fmt(Math.abs(v),d); }
function eqStr(a,b,ad,bd){ return `ŷ = ${sgn(a,ad)} ${b<0?MINUS:'+'} ${fmt(Math.abs(b),bd)}x`; }
function parseNum(s){ s=String(s).replace(/−/g,'-').replace(/[^0-9.\-]/g,''); if(s===''||s==='-'||s==='.') return NaN; return parseFloat(s); }

/* ============ categories ============ */
const CATS = [
  {id:'r',  name:'Correlation r', blurb:'What r tells you and what changes it', color:'var(--c1)'},
  {id:'cz', name:'Cause or Lurker?', blurb:'Correlation vs. causation', color:'var(--c2)'},
  {id:'vb', name:'Variables & Bar Graphs', blurb:'Explanatory, response, association', color:'var(--c3)'},
  {id:'df', name:'Describe It', blurb:'Direction, form, strength, outliers', color:'var(--c4)'},
  {id:'si', name:'Slope & Intercept', blurb:'Interpret in context', color:'var(--c5)'},
  {id:'rp', name:'Residuals & Predictions', blurb:'Plug in, subtract, interpret', color:'var(--c6)'},
];
const TIERS = [{v:1,l:'Warm-up'},{v:2,l:'Apply it'},{v:3,l:'Test-level'}];
const PCOL = ['var(--p1)','var(--p2)','var(--p3)'];
const solo = () => S && S.players.length===1;

/* ============ SVG charts ============ */
function niceStep(range,count){ const raw=range/count, p=10**Math.floor(Math.log10(raw)), m=raw/p; return (m<1.5?1:m<3?2:m<7?5:10)*p; }
function scatterSVG(pts,o={}){
  const W=420,H=300,L=58,R=16,T=16,B=50;
  let xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  if(o.line){ /* keep line inside */ }
  const xp=(x1-x0)*0.08||1, yp=(y1-y0)*0.1||1; x0-=xp; x1+=xp; y0-=yp; y1+=yp;
  const xs1=niceStep(x1-x0,6), ys1=niceStep(y1-y0,5);
  x0=Math.floor(x0/xs1)*xs1; x1=Math.ceil(x1/xs1)*xs1; y0=Math.floor(y0/ys1)*ys1; y1=Math.ceil(y1/ys1)*ys1;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Scatterplot')}">`;
  s+=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="var(--paper)" stroke="none"/>`;
  const xd = xs1<1 ? 1 : 0, yd = ys1<1 ? (ys1<0.1?2:1) : 0;
  for(let v=x0; v<=x1+1e-9; v+=xs1){ s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--grid)" stroke-width="1"/>`;
    if(!o.noTicks) s+=`<text x="${X(v)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${fmt(v,xd)}</text>`; }
  for(let v=y0; v<=y1+1e-9; v+=ys1){ s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    if(!o.noTicks) s+=`<text x="${L-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${o.money?'$'+fmt(v/1000,1)+'k':fmt(v,yd)}</text>`; }
  s+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.5"/>`;
  if(o.line){ const [a,b]=o.line; s+=`<line x1="${X(x0)}" y1="${Y(a+b*x0)}" x2="${X(x1)}" y2="${Y(a+b*x1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4" clip-path="inset(0)"/>`; }
  pts.forEach((p,i)=>{ s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5.5" fill="var(--ink)" stroke="var(--card)" stroke-width="1.5"/>`;
    if(o.labels) s+=`<text x="${X(p[0])+9}" y="${Y(p[1])+5}" font-size="14" font-style="italic" fill="var(--ink)" font-family="var(--body)">${o.labels[i]}</text>`; });
  s+=`<text x="${(L+W-R)/2}" y="${H-8}" font-size="13" text-anchor="middle" fill="var(--ink)" font-weight="700" font-family="var(--body)">${esc(o.xl||'x')}</text>`;
  s+=`<text transform="translate(16 ${(T+H-B)/2}) rotate(-90)" font-size="13" text-anchor="middle" fill="var(--ink)" font-weight="700" font-family="var(--body)">${esc(o.yl||'y')}</text>`;
  return s+'</svg>';
}
function segBarSVG(groups,pcts,A,B,xl){
  const W=420,H=300,L=50,R=12,T=40,Bt=50, bw=70, gap=(W-L-R-bw*groups.length)/(groups.length+1);
  const Y=v=>H-Bt-(v/100)*(H-T-Bt);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Segmented bar graph">`;
  for(let v=0;v<=100;v+=20){ s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${v}</text>`; }
  groups.forEach((g,i)=>{ const x=L+gap+i*(bw+gap), p=pcts[i];
    s+=`<rect x="${x}" y="${Y(100)}" width="${bw}" height="${Y(p)-Y(100)}" fill="var(--ink)" opacity=".75"/>`;

/* ============ scatter generator ============ */
function genScatter({dir=1,form='linear',strength='strong',outlier=false,n=16}){
  const band={strong:[0.86,0.97],moderate:[0.56,0.76],weak:[0.22,0.44]}[strength];
  for(let tries=0;tries<400;tries++){
    let pts=[];
    for(let i=0;i<n;i++){ const x=rd(rnd(1,10),1); let y;
      if(form==='curved'){ const base = dir>0 ? 2+32*Math.exp(-0.42*(10.5-x)) : 2+32*Math.exp(-0.42*(x-0.5)); y=base+gauss()*0.9; }
      else if(dir===0){ y=20+gauss()*4; }
      else { const sd={strong:1.4,moderate:3.4,weak:6.5}[strength]; y=12+dir*2*x+(dir<0?20:0)+gauss()*sd; }
      pts.push([x,rd(y,1)]); }
    const r=corr(pts).r;
    if(form==='linear'){ if(dir===0){ if(Math.abs(r)>0.15) continue; } else if(Math.sign(r)!==dir || Math.abs(r)<band[0] || Math.abs(r)>band[1]) continue; }
    if(outlier){ const x=rd(rnd(3.5,7.5),1); const c=corr(pts); const yhat = form==='curved' ? (dir>0?2+32*Math.exp(-0.42*(10.5-x)):2+32*Math.exp(-0.42*(x-0.5))) : c.a+c.b*x;
      const sd = Math.max(4, Math.sqrt(pts.reduce((s,p)=>s+(p[1]-(c.a+c.b*p[0]))**2,0)/n));
      let y = yhat + (Math.random()<0.5?-1:1)*Math.max(14,4.2*sd); if(y<0) y=yhat+Math.max(14,4.2*sd);
      pts.push([x,rd(y,1)]); }
    return {pts, r:corr(pts).r};
  }
  return genScatter({dir,form,strength,outlier,n});
}

/* ============ team round (test simulator) ============ */
function makeTeam(){
  const c = pick(CTX.filter(c=>c.team));
  const span=c.xr[1]-c.xr[0]; let xs=[];
  while(xs.length<5){ const x=rd(c.xr[0]+span*rnd(0.02,0.98),c.xd); if(xs.every(v=>Math.abs(v-x)>span*0.08)) xs.push(x); }
  xs.sort((p,q)=>p-q);
  const b0=rnd(...c.b), a0=c.cy-b0*c.cx; const oi = pick([2,3,4]);
  let ys = xs.map((x,i)=> rd(a0+b0*x + (i===oi ? (Math.random()<.5?-1:1)*c.noise*rnd(3,3.8) : gauss()*c.noise*0.45), c.yd));
  const pts = xs.map((x,i)=>[x,ys[i]]); const L=corr(pts);
  const b=rd(L.b,2), a=rd(L.a,1), r=L.r;
  const labels=['A','B','C','D','E'];
  const strength=Math.abs(r)>=0.8?'strong':Math.abs(r)>=0.5?'moderate':'weak';
  const resK = pick([0,1,2,3,4].filter(i=>i!==oi)); const [rx,ry]=pts[resK]; const ryh=rd(a+b*rx,4), res=rd(ry-ryh,4);
  let px; do { px = rd(rnd(c.xr[0]+span*0.1, c.xr[1]-span*0.1), c.xd); } while(xs.includes(px));
  const pyh=rd(a+b*px,4); const up=b>0;
  return {ctx:c.id, pts, labels, a, b, r, oi, strength, resK, res, ryh, px, pyh,
    eq:eqStr(a,b,1,2),
    parts:[
     {k:'a', q:`Describe the relationship. Include Direction, Form, Strength, and Outliers.`,
      model:`There is a ${strength}, ${up?'positive':'negative'}, linear relationship between ${c.x} and ${c.y} (r ≈ ${sgn(r,2)}). Point ${labels[oi]} is a possible outlier because it is far ${ys[oi] > a+b*xs[oi] ? 'above' : 'below'} the pattern of the other points.`,
      rubric:[`Direction: ${up?'positive':'negative'}`,'Form: linear',`Strength: ${strength} (accept a neighboring word if explained)`,`Outlier: point ${labels[oi]}`]},
     {k:'b', q:`If the equation of the trendline is ${eqStr(a,b,1,2)}, interpret the slope in context.`,
      model:`For each ${c.xStep}, the <b>predicted</b> ${c.y} ${up?'increases':'decreases'} by about ${fmt(Math.abs(b),2)} ${c.yUnits}.`,
      rubric:['Correct slope value and direction, with units','Uses context and says "predicted" (or "on average")']},
     {k:'c', q:`What is the y-intercept? Does it have a meaning in context? Explain.`,
      model:`The y-intercept is ${sgn(a,1)}. ${c.meaningful ? 'Yes: '+c.interp(a)+'.' : 'No. Literally, '+c.interp(a)+', but '+c.reason+'.'}`,
      rubric:[`Intercept = ${sgn(a,1)}`,`Correct yes/no decision with a reason`]},
     {k:'d', q:`Calculate the residual for ${c.item(rx,ry)} (point ${labels[resK]}). Show work.`,
      model:`ŷ = ${sgn(a,1)} ${b<0?'−':'+'} ${fmt(Math.abs(b),2)}(${fmt(rx,c.xd)}) = ${fmt(ryh,3)}<br>Residual = actual − predicted = ${fmt(ry,c.yd)} − ${fmt(ryh,3)} = <b>${sgn(res,2)} ${c.yUnits}</b>`,
      rubric:['Correct residual with work shown (actual − predicted)']},
     {k:'e', q:`Use the trendline to predict the ${c.y} for ${c.pred(px)}. Show work.`,
      model:`ŷ = ${sgn(a,1)} ${b<0?'−':'+'} ${fmt(Math.abs(b),2)}(${fmt(px,c.xd)}) = <b>${fmt(pyh,2)} ${c.yUnits}</b>`,
      rubric:['Correct prediction with work shown']},
    ]};
}


/* ============ completion codes ============ */
const SALT='pk-statsB-u3';
function fnv(str){ let h=0x811c9dc5; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,0x01000193)>>>0; } return h; }
const b36=(n,w)=>Math.max(0,Math.min(36**w-1,Math.round(n))).toString(36).toUpperCase().padStart(w,'0');
const normNames = arr => arr.map(n=>n.toLowerCase().replace(/[^a-z]/g,'')).filter(Boolean).sort().join('|');
const EPOCH = Date.UTC(2026,0,1);
function dayNum(d=new Date()){ return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/86400000); }
const normOne = n => n.toLowerCase().replace(/[^a-z]/g,'');
/* Short code: 12 base-36 characters (BF-XXXX-XXXX-XXXX) packing minutes, rounds, players, day, and answered/correct per player, plus a check value and a names check. */
const FIELDS=[['mins',6],['team',2],['np',2],['day',5],['a0',5],['c0',5],['a1',5],['c1',5],['a2',5],['c2',5]];
function makeCode(){
  const mins=Math.floor(elapsedMs()/60000);
  const ps=[...S.players].sort((a,b)=>normOne(a.name)<normOne(b.name)?-1:normOne(a.name)>normOne(b.name)?1:0);
  const v={mins:Math.min(63,Math.round(mins/2)), team:S.teamDone, np:S.players.length-1, day:dayNum()%32};
  for(let i=0;i<3;i++){ const p=ps[i]; v['a'+i]=Math.min(31,p?p.ans:0); v['c'+i]=Math.min(31,p?p.cor:0); }
  let P=0n; for(const [k,w] of FIELDS) P=(P<<BigInt(w))|BigInt(v[k]);
  const chk=fnv(P.toString(36)+SALT)%512, nm=fnv(normNames(S.players.map(p=>p.name))+SALT)%256;
  const all=((P<<17n)|(BigInt(chk)<<8n)|BigInt(nm)).toString(36).toUpperCase().padStart(12,'0');
  return {code:'BF-'+all.match(/.{4}/g).join('-'), mins};
}
function checkCode(raw, namesRaw){
  const c=raw.toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/^BF/,'');
  if(c.length===24) return checkCodeLegacy(c, namesRaw);
  if(c.length!==12) return {ok:false, msg:'That code is the wrong length. It should look like BF-XXXX-XXXX-XXXX (12 characters after BF).'};
  let V=0n; for(const ch of c) V=V*36n+BigInt(parseInt(ch,36));
  const nm=Number(V&255n), chk=Number((V>>8n)&511n), P=V>>17n;
  if(fnv(P.toString(36)+SALT)%512!==chk) return {ok:false, msg:'Not a valid code. It may have been mistyped or made up.'};
  const v={}; let x=P; for(const [k,w] of [...FIELDS].reverse()){ v[k]=Number(x&((1n<<BigInt(w))-1n)); x>>=BigInt(w); }
  const today=dayNum(), dn=today-(((today-v.day)%32)+32)%32;
  const d=new Date(EPOCH + dn*86400000), players=v.np+1;
  const out={ok:true, mins:v.mins*2, team:v.team, players, date:d.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',year:'numeric'}), rows:[]};
  for(let i=0;i<players;i++) out.rows.push({ans:v['a'+i], cor:v['c'+i]});
  if(namesRaw.trim()){ const names=namesRaw.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean); out.namesMatch = fnv(normNames(names)+SALT)%256===nm;
    if(out.namesMatch){ const sorted=[...names].sort((a,b)=>normOne(a)<normOne(b)?-1:normOne(a)>normOne(b)?1:0); out.rows.forEach((r,i)=>r.name=sorted[i]); } }
  return out;
}
/* Older 24-character codes (BF-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX) still check. */
function checkCodeLegacy(c, namesRaw){
  if(c.length!==24) return {ok:false, msg:'That code is the wrong length. It should look like BF-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX (24 characters after BF).'};
  const payload=c.slice(0,18), chk=c.slice(18,21), nm=c.slice(21,24);
  if(b36(fnv(payload+SALT)%46656,3)!==chk) return {ok:false, msg:'Not a valid code. It may have been mistyped or made up.'};
  const n=(i,w)=>parseInt(payload.slice(i,i+w),36);
  const d=new Date(EPOCH + n(4,2)*86400000);
  const players=n(3,1);
  const out={ok:true, mins:n(0,2), team:n(2,1), players, date:d.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',year:'numeric'}), rows:[]};
  for(let i=0;i<players;i++) out.rows.push({ans:n(6+i*4,2), cor:n(8+i*4,2)});
  if(namesRaw.trim()){ const names=namesRaw.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean); out.namesMatch = b36(fnv(normNames(names)+SALT)%46656,3)===nm;
    if(out.namesMatch){ const sorted=[...names].sort((a,b)=>normOne(a)<normOne(b)?-1:normOne(a)>normOne(b)?1:0); out.rows.forEach((r,i)=>r.name=sorted[i]); } }
  return out;
}

/* ============ state ============ */
const SAVE_KEY='bestfit-v2';
let S = null;
let setup = {n:2, names:['','',''], len:60};
const MIN_Q = 15;                 // questions each player must answer on their own turns before a code appears
const IDLE_MS = 6*60000, IDLE_TEAM_MS = 15*60000;  // clock auto-pauses after this long with no taps
let lastActivity = Date.now(), hiddenAt = null;
const activeMin = () => Math.floor(elapsedMs()/60000);
const tilesOf = p => p.tiles || (p.tiles={});
const tilesLeft = p => CATS.length*TIERS.length - Object.keys(tilesOf(p)).length;
function freshQuestion(cat,tier){ S.seen = S.seen || []; let q, key;
  for(let i=0;i<60;i++){ q=makeQuestion(cat,tier); key = fnv(q.prompt+'|'+(q.choices?[...q.choices].sort().join('|'):'')+'|'+(q.vis||'')+'|'+(q.num??'')).toString(36); if(!S.seen.includes(key)) break; }
  S.seen.push(key); return q; }
const allDone = () => S.players.every(p=>p.ans>=MIN_Q);
const teamDue = () => S.teamDone<2 && Math.min(...S.players.map(p=>p.ans)) >= 5*(S.teamDone+1);
function freshState(){
  return {phase:'board', players: Array.from({length:setup.n},(_,i)=>({name:setup.names[i].trim()||`Player ${i+1}`, score:0, cats:[], bonus:false, ans:0, cor:0})),
    turn:0, start:Date.now(), pausedAt:null, pausedTotal:0, teamDone:0, teamPending:false,
    stats:Object.fromEntries(CATS.map(c=>[c.id,{att:0,cor:0}])), missed:[], q:null, team:null, turns:0, seen:[]};
}
function save(){ if(S) S.lastSeen=Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function elapsedMs(){ if(!S) return 0; const now = S.pausedAt || Date.now(); return now - S.start - S.pausedTotal; }

  $('#nseg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; keepNames(); setup.n=+b.dataset.n; renderSetup(); };
  $('#go').onclick=()=>{ keepNames(); S=freshState(); save(); render(); };
  const r=$('#resume'); if(r) r.onclick=()=>{ S=saved; if(S.pausedAt==null){ S.pausedAt = S.lastSeen || Date.now(); S.autoPaused='away'; } lastActivity=Date.now(); save(); render(); };

function keepNames(){ for(let i=0;i<3;i++){ const el=$('#name'+i); if(el) setup.names[i]=el.value; } }

function scorebar(){

function resumeClock(){ if(S.pausedAt){ S.pausedTotal += Date.now()-S.pausedAt; S.pausedAt=null; } S.autoPaused=null; lastActivity=Date.now(); save(); render(); }

function pausedNotice(){ if(!S.autoPaused || !S.pausedAt) return ''; const why = S.autoPaused==='away' ? 'The game was closed. Time away is not counted as playing time.' : S.autoPaused==='hidden' ? 'You left this page. Time away is not counted as playing time.' : 'No one has tapped anything for a while. Idle time is not counted as playing time.';

function renderQuestion(){
  const q=S.q, c=CATS.find(x=>x.id===q.cat), st=q.state, p=S.players[S.turn];
  const pts=q.tier;
  let body='';
  if(q.type==='mc'){
    body = `<div class="choices">${q.choices.map((ch,i)=>{ let cls=''; if(st.done&&i===q.ans) cls='right'; else if((st.wrong||[]).includes(i)) cls='wrong';
      return `<button class="choice ${cls}" data-i="${i}" ${st.done||(st.wrong||[]).includes(i)||st.awaitSteal?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${ch}</span></button>`; }).join('')}</div>`;
  } else if(q.type==='num'){
    body = `<div class="numrow"><label for="numin" class="paper-note">Your answer${q.unit&&q.unit!=='$'?` (${esc(q.unit)})`:''}:</label><input id="numin" inputmode="decimal" autocomplete="off" ${st.done||st.awaitSteal?'disabled':''} value="${esc(st.last||'')}"><button class="btn primary" id="check" ${st.done||st.awaitSteal?'disabled':''}>Check</button></div>
      <p class="paper-note">Work it out on paper first. Round to two decimal places if needed.</p>`;
  } else if(q.type==='dfso'){
    body = `<div class="selgrid">${Object.keys(q.opts).map(k=>`<label>${k}<select id="sel-${k}" ${st.done?'disabled':''} class="${st.done?(st.sel[k]===q.ans[k]?'right':'wrong'):''}"><option value="">Choose…</option>${q.opts[k].map(o=>`<option ${st.sel&&st.sel[k]===o?'selected':''}>${o}</option>`).join('')}</select></label>`).join('')}</div>
      ${st.done?'':`<div style="margin-top:12px"><button class="btn primary" id="checkD">Check my description</button></div>`}`;
  } else if(q.type==='fr'){
    body = st.revealed ? `<div class="model"><div class="eyebrow">Model answer</div>${q.model}</div>
      <div class="eyebrow" style="margin-top:8px">${solo()?'Check each thing your answer included (be honest!)':`Partners: check each thing ${esc(p.name)}'s answer included`}</div>
      <div class="rubric">${q.rubric.map((r,i)=>`<label><input type="checkbox" id="rb${i}" ${st.done?'disabled':''} ${(st.checks||[])[i]?'checked':''}><span>${r}</span></label>`).join('')}</div>
      ${st.done?'':`<div style="margin-top:12px"><button class="btn primary" id="award">Award points</button></div>`}`
      : `<p class="paper-note">${solo()?'Write your full answer on paper before you reveal the model answer.':'Write your answer on paper or say it out loud to your partners. Then reveal the model answer.'}</p><button class="btn primary" id="reveal">Reveal model answer</button>`;
  }
  let fb='';
  if(st.awaitSteal){
    fb = `<div class="feedback bad"><h3>Not quite.</h3><p>Steal chance! A partner can try for <b>${Math.ceil(pts/2)} pt${Math.ceil(pts/2)>1?'s':''}</b>. Talk it over first: why was that answer wrong?</p>
      <div class="steal">${S.players.map((pl,i)=>i===S.turn?'':`<button class="btn small" data-steal="${i}" style="border-color:${PCOL[i]};color:${PCOL[i]}">${esc(pl.name)} steals</button>`).join('')}<button class="btn small" id="nosteal">No steal, show answer</button></div></div>`;
  } else if(st.stealer!=null && !st.done){
    fb = `<div class="feedback"><p><b style="color:${PCOL[st.stealer]}">${esc(S.players[st.stealer].name)}</b> is stealing. ${q.type==='num'?'Enter your answer and check.':'Pick one of the remaining choices.'}</p></div>`;
  }
  if(st.done){
    const good = st.result==='right'||st.result==='steal'||(st.result==='partial');
    let head = st.result==='right' ? `Correct! +${st.earned} for ${esc(p.name)}` : st.result==='steal' ? `Stolen! +${st.earned} for ${esc(S.players[st.stealer].name)}` : st.result==='partial' ? `Close. +${st.earned} for ${esc(p.name)}` : st.result==='fr' ? `${esc(p.name)} earns +${st.earned}` : 'No points this time';
    if(q.type==='fr') fb = `<div class="feedback ${st.earned>=2?'good':st.earned?'':'bad'}"><h3>${head}</h3></div>`;
    else fb = `<div class="feedback ${good?'good':'bad'}"><h3>${head}</h3>${q.type==='num'?`<p>Answer: <b class="mono">${q.unit==='$'?(q.num<0?'−':'')+'$'+fmt(Math.abs(q.num),0):sgn(q.num,2)+' '+esc(q.unit)}</b></p>`:''}<p>${q.ex||''}</p>${q.work?`<div class="work">${esc(q.work)}</div>`:''}</div>`;
    if(st.bonus) fb += `<div class="feedback good" style="margin-top:10px"><h3>Full Spread bonus! +3 for ${esc(st.bonus)}</h3><p>Scored in all six categories.</p></div>`;
  }
  app.innerHTML = mast('Unit 3 review: scatterplots, correlation, and regression') + scorebar() + pausedNotice() + `
   <article class="qcard" style="--cc:${c.color}">
     <div class="qhead"><span class="cat"><span class="dot" style="background:${c.color};margin:0"></span>${c.name} · ${TIERS[q.tier-1].l}</span><span class="who"><span style="color:${PCOL[S.turn]}">${esc(p.name)}</span> · worth ${pts} pt${pts>1?'s':''}</span></div>
     <div class="qbody ${q.vis?'has-vis':''}">
       <div style="display:grid;gap:14px;min-width:0"><div class="prompt">${q.prompt}</div>${body}${fb}</div>
       ${q.vis?`<div class="vis">${q.vis}</div>`:''}
     </div>
     <div class="actions">${st.done?`<button class="btn primary" id="next">Next turn →</button>`:''}</div>
   </article>`;
  bindClock();
  // MC
  app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const ch=$('#check'); if(ch){ const go=()=>{ const v=parseNum($('#numin').value); if(isNaN(v)) { $('#numin').focus(); return; } st.last=$('#numin').value; answer(v); }; ch.onclick=go; $('#numin').onkeydown=e=>{ if(e.key==='Enter') go(); }; if(!st.done) $('#numin').focus(); }
  const cd=$('#checkD'); if(cd) cd.onclick=()=>{ st.sel={}; for(const k of Object.keys(q.opts)) st.sel[k]=$('#sel-'+k).value; if(Object.values(st.sel).some(v=>!v)) return; const n=Object.keys(q.ans).filter(k=>st.sel[k]===q.ans[k]).length;
    const earned = n===4?3:n===3?1:0; finish(n===4?'right':n===3?'partial':'wrong', earned, S.turn, n===4); };
  const rv=$('#reveal'); if(rv) rv.onclick=()=>{ st.revealed=true; save(); render(); };
  const aw=$('#award'); if(aw) aw.onclick=()=>{ st.checks=q.rubric.map((_,i)=>$('#rb'+i).checked); const n=st.checks.filter(Boolean).length; finish('fr', Math.min(3,n), S.turn, n>=2); };
  app.querySelectorAll('[data-steal]').forEach(b=>b.onclick=()=>{ st.awaitSteal=false; st.stealer=+b.dataset.steal; if(q.type==='num'){ st.last=''; } save(); render(); });
  const ns=$('#nosteal'); if(ns) ns.onclick=()=>{ st.awaitSteal=false; finish('wrong',0,null,false,true); };
  const nx=$('#next'); if(nx) nx.onclick=nextTurn;
}
function isRight(q,v){ return q.type==='mc' ? v===q.ans : Math.abs(v-q.num) <= q.tol + Math.abs(q.num)*0.002; }
function answer(v){
  const q=S.q, st=q.state;
  if(st.stealer!=null){ // steal attempt
    if(isRight(q,v)) finish('steal', Math.ceil(q.tier/2), st.stealer, false, true);
    else { if(q.type==='mc'){ st.wrong=[...(st.wrong||[]),v]; } finish('wrong',0,null,false,true); }
    return;
  }
  if(isRight(q,v)) finish('right', q.tier, S.turn, true);
  else { if(q.type==='mc') st.wrong=[...(st.wrong||[]),v]; st.firstWrong=true; recordStat(false); if(S.players.length>1){ st.awaitSteal=true; save(); render(); } else finish('wrong',0,null,false,true); }
}
function recordStat(ok){ const s=S.stats[S.q.cat]; s.att++; if(ok) s.cor++; const me=S.players[S.turn]; tilesOf(me)[S.q.cat+'-'+S.q.tier] = ok?'right':'wrong'; me.ans++; if(ok) me.cor++; else S.missed.push({cat:S.q.cat, p:S.q.prompt.replace(/<[^>]+>/g,'')}); }
function finish(result, earned, who, ok, statDone){
  const q=S.q, st=q.state; st.done=true; st.result=result; st.earned=earned;
  if(!statDone && !st.firstWrong) recordStat(ok);
  if(result==='partial') tilesOf(S.players[S.turn])[q.cat+'-'+q.tier]='partial';
  if(who!=null && earned>0){ const pl=S.players[who]; pl.score+=earned; if(!pl.cats.includes(q.cat)) pl.cats.push(q.cat);
    if(!pl.bonus && pl.cats.length===6 && !S.players.some(o=>o.bonus)){ pl.bonus=true; pl.score+=3; st.bonus=pl.name; } }
  save(); render();
}
function nextTurn(){
  S.turn=(S.turn+1)%S.players.length; S.turns++; S.q=null; S.phase='board';
  if(teamDue()) S.teamPending=true;
  save(); render();
}

function renderTeam(){
  const T=S.team, c=CTX.find(x=>x.id===T.ctx);
  const table=`<table class="data"><thead><tr><th></th><th>${esc(c.xl)}</th><th>${esc(c.yl)}</th></tr></thead><tbody>${T.pts.map((p,i)=>`<tr><td>${T.labels[i]}</td><td>${c.money?'$'+fmt(p[0],0):fmt(p[0],c.xd)}</td><td>${fmt(p[1],c.yd)}</td></tr>`).join('')}</tbody></table>`;
  const plot=scatterSVG(T.pts,{labels:T.labels,xl:c.xl,yl:c.yl});
  let lower='';
  if(!T.revealed){
    lower = `<div class="actions" style="padding:0"><button class="btn primary" id="tReveal">We're done: reveal the key</button></div>`;
  } else {
    lower = `<h3 style="margin-top:8px;font-size:22px">Answer key</h3><ul class="parts">${T.parts.map(pt=>`<li><b class="pl">${pt.k})</b> ${pt.model}</li>`).join('')}</ul>
      <h3 style="margin-top:12px;font-size:22px">${solo()?'Score yourself':'Score yourselves'}</h3><p class="paper-note">${solo()?'Check what your paper got right. Each check is worth 1 point.':'Each player checks what their own paper got right. Partners: verify. Each check is worth 1 point.'}</p>
      <div class="pscore">${S.players.map((pl,pi)=>`<div><div class="who" style="color:${PCOL[pi]}">${esc(pl.name)}</div><div class="rubric">${T.parts.flatMap(pt=>pt.rubric.map((r,ri)=>`<label><input type="checkbox" data-p="${pi}" data-k="${pt.k}${ri}" ${T.saved?'disabled':''} ${(T.scores[pi]||[]).includes(pt.k+ri)?'checked':''}><span><b class="mono">${pt.k})</b> ${r}</span></label>`)).join('')}</div></div>`).join('')}</div>
      <div class="actions" style="padding:12px 0 0">${T.saved?`<button class="btn primary" id="tBack">Back to the board →</button>`:`<button class="btn primary" id="tSave">Add these points</button>`}</div>`;
  }
  app.innerHTML = mast(solo()?'Challenge Round: a full test-style problem':'Team Round: a full test-style problem') + scorebar() + pausedNotice() + `
   <section class="panel">
     <div class="eyebrow">${solo()?'Challenge':'Team'} Round ${S.teamDone+1} of 2 · about 8 minutes</div>
     <h2 style="font-size:28px;margin:4px 0 6px">Work it like the real test</h2>
     <p style="max-width:68ch;margin:0 0 16px">${solo()?'Answer every part on your paper in full sentences before you reveal the key.':'Everyone answers on their own paper. You may talk it through together, but write your own answers in full sentences.'} The trendline is <span class="mono" style="background:var(--paper);padding:2px 8px;border-radius:6px">${T.eq}</span>, where x = ${esc(c.x)} and ŷ = predicted ${esc(c.y)}.</p>
     <div class="team-grid"><div style="display:grid;gap:14px;min-width:0"><div style="overflow-x:auto">${table}</div>
       <ol class="parts">${T.parts.map(pt=>`<li><b class="pl">${pt.k})</b> ${pt.q}</li>`).join('')}</ol></div>
       <div class="vis">${plot}</div></div>
     <div style="margin-top:18px">${lower}</div>
   </section>`;
  bindClock();
  const r=$('#tReveal'); if(r) r.onclick=()=>{ T.revealed=true; save(); render(); };
  app.querySelectorAll('input[data-p]').forEach(cb=>cb.onchange=()=>{ const pi=+cb.dataset.p, k=cb.dataset.k; const arr=T.scores[pi]||(T.scores[pi]=[]); if(cb.checked){ if(!arr.includes(k)) arr.push(k); } else T.scores[pi]=arr.filter(x=>x!==k); save(); });
  const sv=$('#tSave'); if(sv) sv.onclick=()=>{ S.players.forEach((pl,pi)=>pl.score+=(T.scores[pi]||[]).length); T.saved=true; S.teamDone++; save(); render(); };
  const bk=$('#tBack'); if(bk) bk.onclick=()=>{ S.phase='board'; S.team=null; if(teamDue()) S.teamPending=true; save(); render(); };
}

function renderResults(){
  const order=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
  const rows=CATS.map(c=>({c, ...S.stats[c.id], pct: S.stats[c.id].att? S.stats[c.id].cor/S.stats[c.id].att : null}));
  const weak=rows.filter(r=>r.att).sort((a,b)=>a.pct-b.pct).slice(0,2).filter(r=>r.pct<0.8);
  const untried=rows.filter(r=>!r.att);
  const cc=makeCode(); const enough = allDone();
  app.innerHTML = mast('Final results') + `
   <div class="results">
     <section class="panel"><div class="eyebrow">Final scores</div><h2 style="font-size:30px;margin:4px 0 14px">${solo()?`${esc(order[0].name)}: ${order[0].score} points${order[0].score>=40?'. You beat 40!':''}`:order[0].score===order[1]?.score?'It\'s a tie at the top!':esc(order[0].name)+' wins!'}</h2>
       <div class="podium">${order.map((p,k)=>`<div class="r" style="--pc:${PCOL[p.i]}"><b>${k+1}. ${esc(p.name)} <span class="paper-note mono" style="display:inline;font-size:14px;font-weight:400">${p.cor}/${p.ans} correct</span></b><span class="mono" style="font-size:26px;font-weight:700;color:${PCOL[p.i]}">${p.score}</span></div>`).join('')}</div>
       <p class="paper-note" style="margin-top:14px">${S.turns} turns played · ${S.teamDone} ${solo()?'Challenge':'Team'} Round${S.teamDone===1?'':'s'}</p>
       ${enough?`<div style="margin-top:18px;border:2px dashed var(--accent);border-radius:12px;padding:14px 16px">
         <div class="eyebrow">Completion code: write this down and turn it in</div>
         <div class="mono" style="font-size:clamp(20px,3.4vw,28px);font-weight:700;letter-spacing:.04em;margin:6px 0">${cc.code.split('-').map(g=>`<span style="white-space:nowrap">${g}</span>`).join('-<wbr>')}</div>
         <div class="paper-note">Also write the names exactly as entered: ${S.players.map(p=>esc(p.name)).join(', ')}. ${S.players.map(p=>`${esc(p.name)}: ${p.cor}/${p.ans} correct`).join(' · ')} · ${S.teamDone}/2 ${solo()?"Challenge":"Team"} Rounds</div>
       </div>`:`<div class="feedback bad" style="margin-top:18px"><h3>No completion code yet</h3><p>Each player needs to answer ${MIN_Q} questions on their own turns. Still needed: ${S.players.filter(p=>p.ans<MIN_Q).map(p=>`${esc(p.name)} ${MIN_Q-p.ans} more`).join(', ')}.</p><button class="btn primary" id="back2">Back to the board</button></div>`}
       <h3 style="margin-top:18px;font-size:22px">Before you leave</h3>
       <p style="max-width:62ch">Each player: write on your paper one thing you will remember for the test, and one question you still have.</p>
     </section>
     <section class="panel"><div class="eyebrow">${solo()?'Your review list':'Your group\'s review list'}</div><h2 style="font-size:26px;margin:4px 0 14px">How each topic went</h2>
       <div class="bars">${rows.map(r=>`<div class="bar" style="--cc:${r.c.color}"><span>${r.c.name}</span><div class="track"><div class="fill" style="width:${r.pct==null?0:Math.round(r.pct*100)}%"></div></div><span class="mono">${r.att?`${r.cor}/${r.att}`:'—'}</span></div>`).join('')}</div>
       ${weak.length||untried.length?`<p style="margin-top:14px"><b>Study these before the test:</b> ${[...weak.map(r=>r.c.name), ...untried.map(r=>r.c.name+' (not tried)')].join(', ')}.</p>`:'<p style="margin-top:14px"><b>Strong work across every topic.</b></p>'}
       ${S.missed.length?`<h3 style="margin-top:12px;font-size:18px">Questions ${solo()?'you':'your group'} missed</h3><ol class="missed">${S.missed.slice(-8).map(m=>`<li><b>${CATS.find(c=>c.id===m.cat).name}:</b> ${esc(m.p.length>140?m.p.slice(0,140)+'…':m.p)}</li>`).join('')}</ol>`:''}
     </section>
   </div>
   <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="again">New game</button><button class="btn" id="back">Back to the board</button></div>`;
  if(!S.pausedAt){ S.pausedAt=Date.now(); save(); }
  $('#again').onclick=()=>{ clearSave(); S=null; render(); };
  if($('#back2')) $('#back2').onclick=()=>{ if(S.pausedAt){ S.pausedTotal+=Date.now()-S.pausedAt; S.pausedAt=null; } S.phase='board'; lastActivity=Date.now(); save(); render(); };
  $('#back').onclick=()=>{ if(S.pausedAt){ S.pausedTotal+=Date.now()-S.pausedAt; S.pausedAt=null; } S.phase='board'; lastActivity=Date.now(); save(); render(); };
}

function render(){
  if(!S) return renderSetup();
  if(S.phase==='board') renderBoard(); else if(S.phase==='question') renderQuestion(); else if(S.phase==='team') renderTeam(); else renderResults();
  window.scrollTo({top:0});
}
let beat=0;
setInterval(()=>{ if(!S || S.phase==='results' || S.pausedAt) return;
  if(!document.hidden){ const lim = S.phase==='team' ? IDLE_TEAM_MS : IDLE_MS;
    if(Date.now()-lastActivity > lim){ S.pausedAt = lastActivity + lim; S.autoPaused='idle'; save(); render(); return; } }
  if(++beat%10===0) save();
  const el=$('#clk'); if(!el) return;
  const e=elapsedMs(); el.textContent = `${Math.floor(e/60000)}:${String(Math.floor(e%60000/1000)).padStart(2,'0')}`;
},1000);
['pointerdown','keydown','input','wheel'].forEach(ev=>document.addEventListener(ev,()=>{ lastActivity=Date.now(); },{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); if(S) save(); return; }
  if(hiddenAt && S && S.phase!=='results' && !S.pausedAt && Date.now()-hiddenAt > 30000){ S.pausedAt=hiddenAt; S.autoPaused='hidden'; save(); render(); }
  hiddenAt=null; lastActivity=Date.now();
});
render();
</script>
</body>
</html>
